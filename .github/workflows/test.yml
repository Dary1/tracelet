name: Test

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      run_aws_smoke:
        description: Run live AWS dev smoke tests (requires repository secrets)
        type: boolean
        default: false

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Flutter unit tests
        run: flutter test

      - name: Validate system trace assets
        run: dart run tool/validate_system_traces.dart

  aws-smoke:
    needs: flutter
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.run_aws_smoke == true
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ap-northeast-1
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: AWS dev smoke tests
        shell: pwsh
        run: ./infra/scripts/smoke-test-dev.ps1
